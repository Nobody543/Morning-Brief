name: Morning Brief

on:
  schedule:
    # 06:30 UTC = 06:30 GMT / 07:30 BST. GitHub Actions cron always runs in
    # UTC and does NOT shift for UK daylight saving, so the local delivery
    # time drifts by an hour across the DST changeover. Adjust the minute/
    # hour below if you want a different fixed local time.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python fetch_feeds.py

      - name: Run scout, analyst, editor, and send stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python main.py --stage all

      - name: Commit updated state
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_articles.csv output/
          git diff --cached --quiet || git commit -m "Morning Brief: $(date -u +%Y-%m-%d)"
          git push
